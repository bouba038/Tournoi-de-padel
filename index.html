<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournoi de Padel</title>
  <style>
    :root {
      --bg: #eef2ed;
      --card-bg: #ffffff;
      --text: #1f2923;
      --text-light: #526359;
      --primary: #1b4332;
      --primary-hover: #081c15;
      --accent: #d8f3dc;
      --border: #c8d6ce;
      --teal: #2d6a4f;
      --orange: #e76f51;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 8px; max-width: 1200px; margin: 0 auto; }
    
    .banner { background: linear-gradient(135deg, var(--primary), var(--teal)); color: white; padding: 12px; border-radius: 10px; display: flex; align-items: center; gap: 10px; margin-bottom: 12px; box-shadow: 0 4px 10px rgba(27,67,50,0.15); }
    .banner .trophy { font-size: 1.8rem; }
    .banner input { background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.5); color: white; font-size: 1.1rem; font-weight: bold; width: 100%; padding: 2px; outline: none; }
    .banner .sub { font-size: 0.75rem; opacity: 0.9; margin-top: 2px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; gap: 6px; flex-wrap: wrap; }
    .topbar-group { display: flex; gap: 6px; align-items: center; }
    .org-badge { background: #d8f3dc; color: var(--primary); border: 1px solid var(--primary); padding: 5px 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    .share-btn { background: #e0e8e2; color: var(--primary); border: 1px solid var(--border); padding: 5px 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }
    .reset-btn { background: #faedcd; color: #9c6644; border: 1px solid #ccd5ae; padding: 5px 8px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.8rem; }

    .format-toggle { display: flex; gap: 8px; margin-bottom: 12px; }
    .format-btn { flex: 1; padding: 8px; border: 2px solid var(--border); background: white; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-light); font-size: 0.85rem; text-align: center; }
    .format-btn.active { border-color: var(--primary); background: var(--accent); color: var(--primary); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 12px; }
    .tab-btn { flex: 1; padding: 8px; border: none; background: #e0e8e2; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-light); text-align: center; font-size: 0.85rem; }
    .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }

    /* Ligne de saisie optimisée pour affichage vertical mobile */
    .teams-container { display: flex; flex-direction: column; gap: 5px; margin-bottom: 15px; }
    .team-row { display: flex; align-items: center; background: white; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--border); gap: 4px; }
    .team-row .num { font-weight: bold; color: var(--text-light); width: 18px; font-size: 0.75rem; flex-shrink: 0; }
    .team-row input { flex: 1; min-width: 0; padding: 4px 5px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.75rem; outline: none; }
    .team-row input:focus { border-color: var(--primary); }
    .team-row input.poids { width: 68px; flex: 0 0 68px; text-align: center; font-size: 0.75rem; padding: 4px 2px; }

    .actions { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn { flex: 1; padding: 10px; border: none; border-radius: 6px; font-size: 0.9rem; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .btn-primary:hover { background: var(--primary-hover); }

    .section { margin-bottom: 15px; background: white; padding: 10px; border-radius: 10px; border: 1px solid var(--border); }
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
    .section-head .dot { width: 8px; height: 8px; border-radius: 50%; }
    .section-head h2 { font-size: 1rem; color: var(--text); }

    .rounds { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; align-items: center; }
    .round-col { min-width: 180px; flex: 1; display: flex; flex-direction: column; gap: 6px; justify-content: center; }
    .round-label { font-size: 0.75rem; font-weight: bold; text-transform: uppercase; color: var(--text-light); text-align: center; background: #f0f4f1; padding: 3px; border-radius: 4px; }
    .matches-col { display: flex; flex-direction: column; gap: 6px; }

    /* Espacements spécifiques pour centrer les quarts par rapport aux 8èmes */
    .matches-col.offset-qf { justify-content: space-around; padding: 12px 0; }

    .match-card { background: #fdfdfd; border: 1px solid var(--border); border-radius: 6px; padding: 5px; font-size: 0.8rem; }
    .team-line { display: flex; justify-content: space-between; align-items: center; padding: 5px 6px; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
    .team-line:hover { background: #f0f4f1; }
    .team-line.winner { background: var(--accent); font-weight: bold; color: var(--primary); border: 1px solid var(--teal); }
    .seed { font-size: 0.65rem; background: #e2e8e0; padding: 1px 3px; border-radius: 3px; margin-right: 3px; color: var(--text-light); font-weight: bold; }

    .schedule-table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
    .schedule-table th, .schedule-table td { padding: 6px 8px; border: 1px solid var(--border); text-align: left; font-size: 0.8rem; }
    .schedule-table th { background: var(--primary); color: white; }
    .schedule-table tr:nth-child(even) { background: #f9fbf9; }
    
    .locked-notice { background: #fff3cd; color: #856404; padding: 6px; border-radius: 6px; font-size: 0.8rem; margin-bottom: 10px; text-align: center; border: 1px solid #ffeeba; }
  </style>
</head>
<body>

  <div id="app">Chargement...</div>

  <script>
    let state = {
      title: "Tournoi du club",
      format: "16",
      phase: "setup",
      activeTab: "bracket",
      isOrgSession: false,
      teamEntries: Array.from({length: 16}, () => ({ player1: "", player2: "", poids: "" })),
      bracket: null
    };

    function isOrganizer() { return state.isOrgSession; }
    
    function toggleOrganizerMode() {
      if (state.isOrgSession) {
        state.isOrgSession = false;
        render();
      } else {
        const pin = prompt("Entrez le code organisateur :");
        if (pin === "2026") {
          state.isOrgSession = true;
          render();
        } else if (pin !== null) {
          alert("Code incorrect !");
        }
      }
    }

    function switchTab(tab) { state.activeTab = tab; render(); }
    function updateTeamEntry(idx, field, val) { 
      if (!state.isOrgSession) return;
      state.teamEntries[idx][field] = val; 
    }

    function setFormat(fmt) {
      if (!state.isOrgSession) return;
      state.format = fmt;
      const count = fmt === '16' ? 16 : 12;
      state.teamEntries = Array.from({length: count}, (_, i) => state.teamEntries[i] || { player1: "", player2: "", poids: "" });
      render();
    }

    function resetSetup() {
      if (!state.isOrgSession) return;
      if (confirm("Réinitialiser les équipes ?")) {
        state.phase = "setup";
        const count = parseInt(state.format);
        state.teamEntries = Array.from({length: count}, () => ({ player1: "", player2: "", poids: "" }));
        render();
      }
    }

    function backToSetup() {
      if (!state.isOrgSession) {
        alert("Mode lecteur : vous ne pouvez pas modifier les équipes.");
        return;
      }
      if (confirm("Modifier les équipes remettra à zéro l'avancement. Continuer ?")) {
        state.phase = "setup";
        render();
      }
    }

    function shuffleArray(array) {
      let arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function launchTournament() {
      state.phase = "running";
      const formatNum = parseInt(state.format);
      
      let teams = state.teamEntries.map((t, i) => ({
        id: i,
        name: (t.player1 || t.player2) ? `${t.player1} / ${t.player2}` : `Équipe ${i+1}`,
        poids: t.poids !== "" ? Number(t.poids) : 0
      }));

      teams.sort((a, b) => b.poids - a.poids);
      teams.forEach((t, index) => { t.seed = index + 1; });

      if (formatNum === 16) {
        let top1_2 = shuffleArray([teams[0], teams[1]]);
        let top3_4 = shuffleArray([teams[2], teams[3]]);
        let top5_8 = shuffleArray([teams[4], teams[5], teams[6], teams[7]]);
        let rest = shuffleArray(teams.slice(8, 16));

        let seededTeams = new Array(16);
        seededTeams[0] = top1_2[0];
        seededTeams[15] = top1_2[1];
        seededTeams[3] = top3_4[0];
        seededTeams[11] = top3_4[1];
        seededTeams[2] = top5_8[0];
        seededTeams[6] = top5_8[1];
        seededTeams[10] = top5_8[2];
        seededTeams[14] = top5_8[3];

        let restIdx = 0;
        for (let i = 0; i < 16; i++) {
          if (!seededTeams[i]) {
            seededTeams[i] = rest[restIdx++];
          }
        }

        state.bracket = {
          size: 16,
          principal: {
            R1: Array.from({length: 8}, (_, i) => ({ id: `p_r1_${i}`, t1: seededTeams[i*2], t2: seededTeams[i*2+1], winner: null })),
            QF: Array.from({length: 4}, (_, i) => ({ id: `p_qf_${i}`, t1: null, t2: null, winner: null })),
            SF: Array.from({length: 2}, (_, i) => ({ id: `p_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `p_f_0`, t1: null, t2: null, winner: null }]
          },
          places5_8: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `p58_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `p58_f_0`, t1: null, t2: null, winner: null }]
          },
          consolante: {
            QF: Array.from({length: 4}, (_, i) => ({ id: `c_qf_${i}`, t1: null, t2: null, winner: null })),
            SF: Array.from({length: 2}, (_, i) => ({ id: `c_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `c_f_0`, t1: null, t2: null, winner: null }]
          },
          repechageA: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `repA_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `repA_f_0`, t1: null, t2: null, winner: null }]
          }
        };

      } else {
        let top1_2 = shuffleArray([teams[0], teams[1]]);
        let top3_4 = shuffleArray([teams[2], teams[3]]);
        let qfTopTeams = [top1_2[0], top3_4[0], top3_4[1], top1_2[1]];

        let top5_8 = shuffleArray([teams[4], teams[5], teams[6], teams[7]]);
        let rest9_12 = shuffleArray([teams[8], teams[9], teams[10], teams[11]]);

        let r1MatchesTeams = [];
        for(let i=0; i<4; i++) {
          r1MatchesTeams.push(top5_8[i]);
          r1MatchesTeams.push(rest9_12[i]);
        }

        state.bracket = {
          size: 12,
          principal: {
            QF: [
              { id: `p_qf_0`, t1: qfTopTeams[0], t2: null, winner: null },
              { id: `p_qf_1`, t1: qfTopTeams[1], t2: null, winner: null },
              { id: `p_qf_2`, t1: qfTopTeams[2], t2: null, winner: null },
              { id: `p_qf_3`, t1: qfTopTeams[3], t2: null, winner: null }
            ],
            SF: Array.from({length: 2}, (_, i) => ({ id: `p_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `p_f_0`, t1: null, t2: null, winner: null }]
          },
          prelim: Array.from({length: 4}, (_, i) => ({ id: `p_r1_${i}`, t1: r1MatchesTeams[i*2], t2: r1MatchesTeams[i*2+1], winner: null })),
          consolante: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `c_sf_${i}`, t1: null, t2: null, winner: null })),
            F: [{ id: `c_f_0`, t1: null, t2: null, winner: null }]
          }
        };
      }

      render();
    }

    function selectWinner(section, round, matchId, teamNum) {
      if (!state.isOrgSession) {
        alert("Mode lecteur : vous ne pouvez pas modifier les vainqueurs.");
        return;
      }

      let matchArray = section === "prelim" ? state.bracket.prelim : state.bracket[section][round];
      const matchIndex = matchArray.findIndex(m => m.id === matchId);
      if (matchIndex === -1) return;
      
      const match = matchArray[matchIndex];
      if (!match.t1 || !match.t2) return;

      const winner = teamNum === 1 ? match.t1 : match.t2;
      const loser = teamNum === 1 ? match.t2 : match.t1;
      match.winner = winner;

      if (state.bracket.size === 12) {
        if (section === "prelim") {
          const qfMatch = state.bracket.principal.QF[matchIndex];
          qfMatch.t2 = winner;
          
          const consMatchIndex = Math.floor(matchIndex / 2);
          const consMatch = state.bracket.consolante.SF[consMatchIndex];
          if (matchIndex % 2 === 0) consMatch.t1 = loser; else consMatch.t2 = loser;

        } else if (section === "principal" && round === "QF") {
          const nextMatchIndex = Math.floor(matchIndex / 2);
          const nextMatch = state.bracket.principal.SF[nextMatchIndex];
          if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (section === "principal" && round === "SF") {
          const nextMatch = state.bracket.principal.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (section === "consolante" && round === "SF") {
          const nextMatch = state.bracket.consolante.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      } else {
        if (section === "principal") {
          if (round === "R1") {
            const consMatchIndex = Math.floor(matchIndex / 2);
            const consMatch = state.bracket.consolante.QF[consMatchIndex];
            if (matchIndex % 2 === 0) consMatch.t1 = loser; else consMatch.t2 = loser;

            const nextMatchIndex = Math.floor(matchIndex / 2);
            const nextMatch = state.bracket.principal.QF[nextMatchIndex];
            if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
          } else if (round === "QF") {
            const p58Index = Math.floor(matchIndex / 2);
            const p58Match = state.bracket.places5_8.SF[p58Index];
            if (matchIndex % 2 === 0) p58Match.t1 = loser; else p58Match.t2 = loser;

            const nextMatchIndex = Math.floor(matchIndex / 2);
            const nextMatch = state.bracket.principal.SF[nextMatchIndex];
            if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
          } else if (round === "SF") {
            const nextMatch = state.bracket.principal.F[0];
            if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
          }
        } else if (section === "places5_8" && round === "SF") {
          const nextMatch = state.bracket.places5_8.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (section === "consolante") {
          if (round === "QF") {
            const repIndex = Math.floor(matchIndex / 2);
            const repMatch = state.bracket.repechageA.SF[repIndex];
            if (matchIndex % 2 === 0) repMatch.t1 = loser; else repMatch.t2 = loser;

            const nextMatchIndex = Math.floor(matchIndex / 2);
            const nextMatch = state.bracket.consolante.SF[nextMatchIndex];
            if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
          } else if (round === "SF") {
            const nextMatch = state.bracket.consolante.F[0];
            if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
          }
        } else if (section === "repechageA" && round === "SF") {
          const nextMatch = state.bracket.repechageA.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      }

      render();
    }

    function renderMatchCard(m, section, round) {
      const t1Name = m.t1 ? `${m.t1.seed ? `<span class="seed">#${m.t1.seed}</span>` : ''}${m.t1.name}` : "En attente...";
      const t2Name = m.t2 ? `${m.t2.seed ? `<span class="seed">#${m.t2.seed}</span>` : ''}${m.t2.name}` : "En attente...";
      const isW1 = m.winner && m.t1 && m.winner.id === m.t1.id;
      const isW2 = m.winner && m.t2 && m.winner.id === m.t2.id;

      return `
        <div class="match-card">
          <div class="team-line ${isW1 ? 'winner' : ''}" onclick="selectWinner('${section}', '${round}', '${m.id}', 1)">
            <span>${t1Name}</span>
            ${isW1 ? '<span>✔</span>' : ''}
          </div>
          <div style="border-top:1px solid var(--border); margin:2px 0;"></div>
          <div class="team-line ${isW2 ? 'winner' : ''}" onclick="selectWinner('${section}', '${round}', '${m.id}', 2)">
            <span>${t2Name}</span>
            ${isW2 ? '<span>✔</span>' : ''}
          </div>
        </div>
      `;
    }

    function shareTournoi() {
      if (navigator.share) {
        navigator.share({ title: state.title, url: window.location.href }).catch(() => {});
      } else {
        prompt("Copiez le lien du tournoi :", window.location.href);
      }
    }

    function render() {
      const app = document.getElementById("app");
      if (!state) return;
      const organizer = isOrganizer();

      app.innerHTML = `
        <div class="banner">
          <div class="trophy">🏆</div>
          <div style="flex:1;">
            <input type="text" value="${state.title || 'Tournoi du club'}" ${!organizer ? 'readonly' : ''} oninput="state.title=this.value;" placeholder="Nom du tournoi" />
            <div class="sub">${state.phase === 'setup' ? 'Configuration & Têtes de série' : `${state.bracket.size} équipes en lice`}</div>
          </div>
        </div>

        <div class="topbar">
          <div class="topbar-group">
            <button class="org-badge" onclick="toggleOrganizerMode()">${organizer ? '🔒 Mode Organisateur' : '🔑 Mode Lecteur'}</button>
            <button class="share-btn" onclick="shareTournoi()">🔗 Partager</button>
          </div>
          ${organizer && state.phase === 'setup' ? `<button class="reset-btn" onclick="resetSetup()">🔄 Vider</button>` : ''}
          ${organizer && state.phase === 'running' ? `<button class="reset-btn" onclick="backToSetup()">⚙️ Équipes</button>` : ''}
        </div>

        ${!organizer ? `<div class="locked-notice">Mode Lecteur actif : les modifications sont verrouillées.</div>` : ''}

        ${state.phase === 'setup' ? `
          <div class="format-toggle">
            <button class="format-btn ${state.format === '16' ? 'active' : ''}" ${!organizer ? 'disabled' : ''} onclick="setFormat('16')">Tournoi 16 Équipes</button>
            <button class="format-btn ${state.format === '12' ? 'active' : ''}" ${!organizer ? 'disabled' : ''} onclick="setFormat('12')">Tournoi 12 Équipes</button>
          </div>

          <div class="teams-container">
            ${state.teamEntries.map((team, idx) => `
              <div class="team-row">
                <span class="num">${idx+1}.</span>
                <input type="text" placeholder="Joueur 1" value="${team.player1 || ''}" ${!organizer ? 'readonly' : ''} oninput="updateTeamEntry(${idx}, 'player1', this.value)" />
                <input type="text" placeholder="Joueur 2" value="${team.player2 || ''}" ${!organizer ? 'readonly' : ''} oninput="updateTeamEntry(${idx}, 'player2', this.value)" />
                <input type="text" class="poids" placeholder="Poids" maxlength="6" value="${team.poids || ''}" ${!organizer ? 'readonly' : ''} oninput="updateTeamEntry(${idx}, 'poids', this.value)" />
              </div>
            `).join('')}
          </div>

          ${organizer ? `
            <div class="actions">
              <button class="btn btn-primary" onclick="launchTournament()">🚀 Lancer le Tournoi</button>
            </div>
          ` : ''}
        ` : `
          <div class="nav-tabs">
            <button class="tab-btn ${state.activeTab==='bracket'?'active':''}" onclick="switchTab('bracket')">📊 Tableau & Matchs</button>
            <button class="tab-btn ${state.activeTab==='schedule'?'active':''}" onclick="switchTab('schedule')">🕒 Horaires</button>
          </div>

          ${state.activeTab === 'bracket' ? `
            ${state.bracket.size === 12 ? `
              <div class="section">
                <div class="section-head"><div class="dot" style="background:var(--orange)"></div><h2>Tour Préliminaire (Têtes 5-8 vs 9-12)</h2></div>
                <div class="rounds">
                  <div class="round-col"><div class="round-label">Matchs Tour 1</div><div class="matches-col">${(state.bracket.prelim||[]).map(m=>renderMatchCard(m,"prelim","")).join('')}</div></div>
                </div>
              </div>
            ` : ''}

            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--teal)"></div><h2>Tableau Principal</h2></div>
              <div class="rounds">
                ${state.bracket.size === 16 ? `<div class="round-col"><div class="round-label">8èmes</div><div class="matches-col">${(state.bracket.principal.R1||[]).map(m=>renderMatchCard(m,"principal","R1")).join('')}</div></div>` : ''}
                <div class="round-col"><div class="round-label">Quarts</div><div class="matches-col offset-qf">${(state.bracket.principal.QF||[]).map(m=>renderMatchCard(m,"principal","QF")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Demis</div><div class="matches-col">${(state.bracket.principal.SF||[]).map(m=>renderMatchCard(m,"principal","SF")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Finale</div><div class="matches-col">${(state.bracket.principal.F||[]).map(m=>renderMatchCard(m,"principal","F")).join('')}</div></div>
              </div>
            </div>

            ${state.bracket.size === 16 ? `
              <div class="section">
                <div class="section-head"><div class="dot" style="background:#e76f51"></div><h2>Places 5 à 8</h2></div>
                <div class="rounds">
                  <div class="round-col"><div class="round-label">Demis (5-8)</div><div class="matches-col">${(state.bracket.places5_8.SF||[]).map(m=>renderMatchCard(m,"places5_8","SF")).join('')}</div></div>
                  <div class="round-col"><div class="round-label">Finale (5-6)</div><div class="matches-col">${(state.bracket.places5_8.F||[]).map(m=>renderMatchCard(m,"places5_8","F")).join('')}</div></div>
                </div>
              </div>
            ` : ''}

            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--orange)"></div><h2>Consolante</h2></div>
              <div class="rounds">
                <div class="round-col"><div class="round-label">Demis Cons.</div><div class="matches-col">${(state.bracket.consolante.SF||[]).map(m=>renderMatchCard(m,"consolante","SF")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Finale Cons.</div><div class="matches-col">${(state.bracket.consolante.F||[]).map(m=>renderMatchCard(m,"consolante","F")).join('')}</div></div>
              </div>
            </div>
          ` : `
            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--teal)"></div><h2>Planning des Terrains</h2></div>
              <table class="schedule-table">
                <thead>
                  <tr><th>Horaire</th><th>Terrain 1</th><th>Terrain 2</th><th>Terrain 3</th></tr>
                </thead>
                <tbody>
                  <tr><td>09:00</td><td>Match 1</td><td>Match 2</td><td>Match 3</td></tr>
                  <tr><td>09:30</td><td>Match 4</td><td>Match 5</td><td>Match 6</td></tr>
                </tbody>
              </table>
            </div>
          `}
        `}
      `;
    }

    render();
  </script>
</body>
</html>
