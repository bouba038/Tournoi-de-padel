<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tournoi de Padel</title>
  <style>
    :root {
      --bg: #eef2ed;
      --card-bg: #ffffff;
      --text: #1f2923;
      --text-light: #526359;
      --primary: #1b4332;
      --primary-hover: #081c15;
      --accent: #d8f3dc;
      --border: #c8d6ce;
      --teal: #2d6a4f;
      --orange: #e76f51;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 10px; max-width: 1200px; margin: 0 auto; }
    
    .banner { background: linear-gradient(135deg, var(--primary), var(--teal)); color: white; padding: 15px; border-radius: 10px; display: flex; align-items: center; gap: 12px; margin-bottom: 15px; box-shadow: 0 4px 10px rgba(27,67,50,0.15); }
    .banner .trophy { font-size: 2rem; }
    .banner input { background: transparent; border: none; border-bottom: 2px solid rgba(255,255,255,0.5); color: white; font-size: 1.2rem; font-weight: bold; width: 100%; padding: 2px; outline: none; }
    .banner .sub { font-size: 0.8rem; opacity: 0.9; margin-top: 2px; }

    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; gap: 8px; flex-wrap: wrap; }
    .org-badge { background: #d8f3dc; color: var(--primary); border: 1px solid var(--primary); padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }
    .reset-btn { background: #faedcd; color: #9c6644; border: 1px solid #ccd5ae; padding: 6px 10px; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.85rem; }

    .format-toggle { display: flex; gap: 8px; margin-bottom: 15px; }
    .format-btn { flex: 1; padding: 8px; border: 2px solid var(--border); background: white; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-light); font-size: 0.9rem; text-align: center; }
    .format-btn.active { border-color: var(--primary); background: var(--accent); color: var(--primary); }

    .nav-tabs { display: flex; gap: 8px; margin-bottom: 15px; }
    .tab-btn { flex: 1; padding: 10px; border: none; background: #e0e8e2; border-radius: 6px; font-weight: bold; cursor: pointer; color: var(--text-light); text-align: center; font-size: 0.9rem; }
    .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }

    .teams-container { display: flex; flex-direction: column; gap: 6px; margin-bottom: 15px; }
    .team-row { display: flex; align-items: center; background: white; padding: 6px 10px; border-radius: 6px; border: 1px solid var(--border); gap: 6px; }
    .team-row .num { font-weight: bold; color: var(--text-light); width: 20px; font-size: 0.85rem; }
    .team-row input { flex: 1; padding: 6px 8px; border: 1px solid var(--border); border-radius: 4px; font-size: 0.85rem; outline: none; }
    .team-row input:focus { border-color: var(--primary); }
    .team-row input.poids { width: 55px; flex: none; text-align: center; }

    .actions { display: flex; gap: 8px; margin-bottom: 20px; }
    .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-size: 0.95rem; font-weight: bold; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--primary); color: white; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-outline { background: white; border: 2px solid var(--primary); color: var(--primary); }

    .section { margin-bottom: 20px; background: white; padding: 12px; border-radius: 10px; border: 1px solid var(--border); }
    .section-head { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
    .section-head .dot { width: 10px; height: 10px; border-radius: 50%; }
    .section-head h2 { font-size: 1.1rem; color: var(--text); }

    .rounds { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 8px; }
    .round-col { min-width: 200px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .round-label { font-size: 0.8rem; font-weight: bold; text-transform: uppercase; color: var(--text-light); text-align: center; background: #f0f4f1; padding: 4px; border-radius: 4px; }
    .matches-col { display: flex; flex-direction: column; gap: 8px; }

    .match-card { background: #fdfdfd; border: 1px solid var(--border); border-radius: 6px; padding: 8px; font-size: 0.85rem; }
    .team-line { display: flex; justify-content: space-between; align-items: center; padding: 4px 6px; border-radius: 4px; }
    .team-line.winner { background: var(--accent); font-weight: bold; color: var(--primary); }
    .team-line input.score { width: 35px; text-align: center; border: 1px solid var(--border); border-radius: 4px; padding: 2px; }
    .seed { font-size: 0.7rem; background: #e2e8e0; padding: 1px 4px; border-radius: 3px; margin-right: 4px; color: var(--text-light); font-weight: bold; }

    .schedule-table { width: 100%; border-collapse: collapse; background: white; border-radius: 6px; overflow: hidden; }
    .schedule-table th, .schedule-table td { padding: 8px 10px; border: 1px solid var(--border); text-align: left; font-size: 0.85rem; }
    .schedule-table th { background: var(--primary); color: white; }
    .schedule-table tr:nth-child(even) { background: #f9fbf9; }
  </style>
</head>
<body>

  <div id="app">Chargement...</div>

  <script>
    let state = {
      title: "Tournoi du club",
      format: "16",
      phase: "setup",
      activeTab: "bracket",
      isOrgSession: true,
      teamEntries: Array.from({length: 16}, () => ({ player1: "", player2: "", poids: "" })),
      bracket: null
    };

    function isOrganizer() { return state.isOrgSession; }
    function toggleOrganizerMode() { state.isOrgSession = !state.isOrgSession; render(); }
    function switchTab(tab) { state.activeTab = tab; render(); }
    function updateTeamEntry(idx, field, val) { state.teamEntries[idx][field] = val; }

    function setFormat(fmt) {
      state.format = fmt;
      const count = fmt === '16' ? 16 : 12;
      state.teamEntries = Array.from({length: count}, (_, i) => state.teamEntries[i] || { player1: "", player2: "", poids: "" });
      render();
    }

    function resetSetup() {
      if (confirm("Réinitialiser les équipes ?")) {
        state.phase = "setup";
        const count = parseInt(state.format);
        state.teamEntries = Array.from({length: count}, () => ({ player1: "", player2: "", poids: "" }));
        render();
      }
    }

    function backToSetup() {
      if (confirm("Modifier les équipes remettra à zéro l'avancement. Continuer ?")) {
        state.phase = "setup";
        render();
      }
    }

    function launchTournament() {
      state.phase = "running";
      const formatNum = parseInt(state.format);
      
      let teams = state.teamEntries.map((t, i) => ({
        id: i,
        name: (t.player1 || t.player2) ? `${t.player1} / ${t.player2}` : `Équipe ${i+1}`,
        poids: t.poids !== "" ? Number(t.poids) : 0
      }));

      teams.sort((a, b) => b.poids - a.poids);
      teams.forEach((t, index) => { t.seed = index + 1; });

      let seededTeams = [];
      if (formatNum === 16) {
        const indices16 = [0, 15, 7, 8, 3, 12, 4, 11, 1, 14, 6, 9, 2, 13, 5, 10];
        seededTeams = indices16.map(idx => teams[idx] || { id: idx, name: "BYE", seed: idx+1 });
      } else {
        const indices12 = [0, 11, 7, 4, 3, 8, 2, 9, 1, 10, 5, 6];
        seededTeams = indices12.map(idx => teams[idx] || { id: idx, name: "BYE", seed: idx+1 });
      }

      if (formatNum === 16) {
        state.bracket = {
          size: 16,
          principal: {
            R1: Array.from({length: 8}, (_, i) => ({ id: `p_r1_${i}`, t1: seededTeams[i*2], t2: seededTeams[i*2+1], s1: "", s2: "", winner: null })),
            QF: Array.from({length: 4}, (_, i) => ({ id: `p_qf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            SF: Array.from({length: 2}, (_, i) => ({ id: `p_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `p_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          },
          // Places 5 à 8 : Perdants des Quarts de finale
          places5_8: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `p58_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `p58_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          },
          // Consolante : Places 9 à 16 (Perdants des Huitièmes de finale)
          consolante: {
            QF: Array.from({length: 4}, (_, i) => ({ id: `c_qf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            SF: Array.from({length: 2}, (_, i) => ({ id: `c_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `c_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          },
          // Repêchage A : Places 13 à 16 (Perdants des Quarts de consolante)
          repechageA: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `repA_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `repA_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          }
        };
      } else {
        state.bracket = {
          size: 12,
          principal: {
            QF: Array.from({length: 4}, (_, i) => ({ id: `p_qf_${i}`, t1: seededTeams[i*2], t2: seededTeams[i*2+1], s1: "", s2: "", winner: null })),
            SF: Array.from({length: 2}, (_, i) => ({ id: `p_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `p_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          },
          consolante: {
            SF: Array.from({length: 2}, (_, i) => ({ id: `c_sf_${i}`, t1: null, t2: null, s1: "", s2: "", winner: null })),
            F: [{ id: `c_f_0`, t1: null, t2: null, s1: "", s2: "", winner: null }]
          }
        };
      }
      render();
    }

    function updateScore(section, round, matchId, teamNum, val) {
      const matchArray = state.bracket[section][round];
      const matchIndex = matchArray.findIndex(m => m.id === matchId);
      if (matchIndex === -1) return;
      
      const match = matchArray[matchIndex];
      if (teamNum === 1) match.s1 = val; else match.s2 = val;

      let winner = null, loser = null;
      if (match.s1 !== "" && match.s2 !== "") {
        if (Number(match.s1) > Number(match.s2)) { winner = match.t1; loser = match.t2; }
        else if (Number(match.s2) > Number(match.s1)) { winner = match.t2; loser = match.t1; }
      }
      match.winner = winner;

      // Propagation automatique des vainqueurs et perdants
      if (section === "principal") {
        if (round === "R1") {
          // Perdants en Huitièmes -> Consolante (Places 9-16)
          const consMatchIndex = Math.floor(matchIndex / 2);
          const consMatch = state.bracket.consolante.QF[consMatchIndex];
          if (matchIndex % 2 === 0) consMatch.t1 = loser; else consMatch.t2 = loser;

          // Vainqueurs en Huitièmes -> Quarts de finale
          const nextMatchIndex = Math.floor(matchIndex / 2);
          const nextMatch = state.bracket.principal.QF[nextMatchIndex];
          if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (round === "QF") {
          // Perdants en Quarts -> Places 5 à 8
          const p58Index = Math.floor(matchIndex / 2);
          const p58Match = state.bracket.places5_8.SF[p58Index];
          if (matchIndex % 2 === 0) p58Match.t1 = loser; else p58Match.t2 = loser;

          // Vainqueurs en Quarts -> Demis
          const nextMatchIndex = Math.floor(matchIndex / 2);
          const nextMatch = state.bracket.principal.SF[nextMatchIndex];
          if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (round === "SF") {
          const nextMatch = state.bracket.principal.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      } else if (section === "places5_8") {
        if (round === "SF") {
          const nextMatch = state.bracket.places5_8.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      } else if (section === "consolante") {
        if (round === "QF") {
          // Perdants des Quarts de consolante -> Repêchage A (Places 13-16)
          const repIndex = Math.floor(matchIndex / 2);
          const repMatch = state.bracket.repechageA.SF[repIndex];
          if (matchIndex % 2 === 0) repMatch.t1 = loser; else repMatch.t2 = loser;

          // Vainqueurs -> Demis consolante
          const nextMatchIndex = Math.floor(matchIndex / 2);
          const nextMatch = state.bracket.consolante.SF[nextMatchIndex];
          if (matchIndex % 2 === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        } else if (round === "SF") {
          const nextMatch = state.bracket.consolante.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      } else if (section === "repechageA") {
        if (round === "SF") {
          const nextMatch = state.bracket.repechageA.F[0];
          if (matchIndex === 0) nextMatch.t1 = winner; else nextMatch.t2 = winner;
        }
      }

      render();
    }

    function renderMatchCard(m, section, round) {
      const t1Name = m.t1 ? `${m.t1.seed ? `<span class="seed">#${m.t1.seed}</span>` : ''}${m.t1.name}` : "En attente...";
      const t2Name = m.t2 ? `${m.t2.seed ? `<span class="seed">#${m.t2.seed}</span>` : ''}${m.t2.name}` : "En attente...";
      const isW1 = m.winner && m.t1 && m.winner.id === m.t1.id;
      const isW2 = m.winner && m.t2 && m.winner.id === m.t2.id;

      return `
        <div class="match-card">
          <div class="team-line ${isW1 ? 'winner' : ''}">
            <span>${t1Name}</span>
            <input type="number" class="score" value="${m.s1}" oninput="updateScore('${section}', '${round}', '${m.id}', 1, this.value)" />
          </div>
          <div style="border-top:1px solid var(--border); margin:3px 0;"></div>
          <div class="team-line ${isW2 ? 'winner' : ''}">
            <span>${t2Name}</span>
            <input type="number" class="score" value="${m.s2}" oninput="updateScore('${section}', '${round}', '${m.id}', 2, this.value)" />
          </div>
        </div>
      `;
    }

    function shareTournoi() {
      if (navigator.share) {
        navigator.share({ title: state.title, url: window.location.href }).catch(() => {});
      } else {
        prompt("Copiez le lien du tournoi :", window.location.href);
      }
    }

    function render() {
      const app = document.getElementById("app");
      if (!state) return;
      const organizer = isOrganizer();

      if (state.phase === "setup") {
        app.innerHTML = `
          <div class="banner">
            <div class="trophy">🏆</div>
            <div style="flex:1;">
              <input type="text" value="${state.title || 'Tournoi du club'}" oninput="state.title=this.value;" placeholder="Nom du tournoi" />
              <div class="sub">Configuration & Têtes de série</div>
            </div>
          </div>

          <div class="topbar">
            <button class="org-badge" onclick="toggleOrganizerMode()">${organizer ? '🔒 Mode Organisateur' : '🔑 Mode Lecteur'}</button>
            ${organizer ? `<button class="reset-btn" onclick="resetSetup()">🔄 Vider</button>` : ''}
          </div>

          <div class="format-toggle">
            <button class="format-btn ${state.format === '16' ? 'active' : ''}" onclick="setFormat('16')">Tournoi 16 Équipes</button>
            <button class="format-btn ${state.format === '12' ? 'active' : ''}" onclick="setFormat('12')">Tournoi 12 Équipes</button>
          </div>

          <div class="teams-container">
            ${state.teamEntries.map((team, idx) => `
              <div class="team-row">
                <span class="num">${idx+1}.</span>
                <input type="text" placeholder="Joueur 1" value="${team.player1 || ''}" oninput="updateTeamEntry(${idx}, 'player1', this.value)" />
                <input type="text" placeholder="Joueur 2" value="${team.player2 || ''}" oninput="updateTeamEntry(${idx}, 'player2', this.value)" />
                <input type="text" class="poids" placeholder="Poids" value="${team.poids || ''}" oninput="updateTeamEntry(${idx}, 'poids', this.value)" />
              </div>
            `).join('')}
          </div>

          <div class="actions">
            <button class="btn btn-primary" onclick="launchTournament()">🚀 Lancer le Tournoi</button>
          </div>
        `;
      } else {
        const b = state.bracket;
        app.innerHTML = `
          <div class="banner">
            <div class="trophy">🏆</div>
            <div style="flex:1;">
              <input type="text" value="${state.title || 'Tournoi du club'}" readonly />
              <div class="sub">${b.size} équipes en lice</div>
            </div>
          </div>

          <div class="topbar">
            <button class="org-badge" onclick="toggleOrganizerMode()">${organizer ? '🔒 Mode Organisateur' : '🔑 Mode Lecteur'}</button>
            <button class="reset-btn" onclick="backToSetup()">⚙️ Équipes</button>
          </div>

          <div class="nav-tabs">
            <button class="tab-btn ${state.activeTab==='bracket'?'active':''}" onclick="switchTab('bracket')">📊 Tableau & Matchs</button>
            <button class="tab-btn ${state.activeTab==='schedule'?'active':''}" onclick="switchTab('schedule')">🕒 Horaires</button>
          </div>

          ${state.activeTab === 'bracket' ? `
            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--teal)"></div><h2>Tableau Principal (Places 1 à 4)</h2></div>
              <div class="rounds">
                ${b.size === 16 ? `<div class="round-col"><div class="round-label">8èmes</div><div class="matches-col">${(b.principal.R1||[]).map(m=>renderMatchCard(m,"principal","R1")).join('')}</div></div>` : ''}
                <div class="round-col"><div class="round-label">${b.size === 16 ? 'Quarts' : '1ers Tours'}</div><div class="matches-col">${(b.principal.QF || b.principal.R1 || []).map(m=>renderMatchCard(m,"principal", b.size === 16 ? "QF" : "R1")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Demis</div><div class="matches-col">${(b.principal.SF||[]).map(m=>renderMatchCard(m,"principal","SF")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Finale</div><div class="matches-col">${(b.principal.F||[]).map(m=>renderMatchCard(m,"principal","F")).join('')}</div></div>
              </div>
            </div>

            ${b.size === 16 ? `
              <div class="section">
                <div class="section-head"><div class="dot" style="background:#e76f51"></div><h2>Places 5 à 8 (Perdants des Quarts)</h2></div>
                <div class="rounds">
                  <div class="round-col"><div class="round-label">Demis (5-8)</div><div class="matches-col">${(b.places5_8.SF||[]).map(m=>renderMatchCard(m,"places5_8","SF")).join('')}</div></div>
                  <div class="round-col"><div class="round-label">Finale (5-6)</div><div class="matches-col">${(b.places5_8.F||[]).map(m=>renderMatchCard(m,"places5_8","F")).join('')}</div></div>
                </div>
              </div>
            ` : ''}

            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--orange)"></div><h2>Consolante (Places 9 à 16)</h2></div>
              <div class="rounds">
                ${b.size === 16 ? `<div class="round-col"><div class="round-label">Quarts (9-16)</div><div class="matches-col">${(b.consolante.QF||[]).map(m=>renderMatchCard(m,"consolante","QF")).join('')}</div></div>` : ''}
                <div class="round-col"><div class="round-label">Demis Cons.</div><div class="matches-col">${(b.consolante.SF||[]).map(m=>renderMatchCard(m,"consolante","SF")).join('')}</div></div>
                <div class="round-col"><div class="round-label">Finale Cons.</div><div class="matches-col">${(b.consolante.F||[]).map(m=>renderMatchCard(m,"consolante","F")).join('')}</div></div>
              </div>
            </div>

            ${b.size === 16 ? `
              <div class="section">
                <div class="section-head"><div class="dot" style="background:#457b9d"></div><h2>Repêchage A (Places 13 à 16)</h2></div>
                <div class="rounds">
                  <div class="round-col"><div class="round-label">Demis (13-16)</div><div class="matches-col">${(b.repechageA.SF||[]).map(m=>renderMatchCard(m,"repechageA","SF")).join('')}</div></div>
                  <div class="round-col"><div class="round-label">Finale (13-14)</div><div class="matches-col">${(b.repechageA.F||[]).map(m=>renderMatchCard(m,"repechageA","F")).join('')}</div></div>
                </div>
              </div>
            ` : ''}
          ` : `
            <div class="section">
              <div class="section-head"><div class="dot" style="background:var(--teal)"></div><h2>Planning des Terrains</h2></div>
              <table class="schedule-table">
                <thead>
                  <tr><th>Horaire</th><th>Terrain 1</th><th>Terrain 2</th><th>Terrain 3</th></tr>
                </thead>
                <tbody>
                  <tr><td>09:00</td><td>Match 1</td><td>Match 2</td><td>Match 3</td></tr>
                  <tr><td>09:30</td><td>Match 4</td><td>Match 5</td><td>Match 6</td></tr>
                </tbody>
              </table>
            </div>
          `}

          <div class="actions" style="margin-top:15px;">
            <button class="btn btn-outline" onclick="shareTournoi()">📋 Partager le lien</button>
          </div>
        `;
      }
    }

    render();
  </script>
</body>
</html>
